<div id="main" class="h-screen flex items-center justify-center">
    <form 
        class="bg-gray-300 shadow-md rounded px-8 pt-6 pb-8 mb-4"
        id="meuForm"
        action=""
        method="get"
    >

        <div class="mb-4">
            <label
                class="block text-gray-700 text-sm font-bold mb-2"
                for="num"
            >
                Digite o primeiro número:
            </label>

            <input
                class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                type="number"
                name="num1"
                id="num1"
            >
        </div>

        <div class="mb-4">
            <label
                class="block text-gray-700 text-sm font-bold mb-2"
                for="num"
            >
                Digite o segundo número:
            </label>

            <input
                class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                type="number"
                name="num2"
                id="num2"
            >
        </div>

        <div class="mb-4">
            <label
                class="block text-gray-700 text-sm font-bold mb-2"
                for="num"
            >
                Digite o terceiro número:
            </label>

            <input
                class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                type="number"
                name="num3"
                id="num3"
            >
        </div>

        <div class="flex items-center justify-center">
            <input
                class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline"
                type="submit"
                value="Enviar"
            >
        </div>
    </form>
</div>

<script>
    document.getElementById("meuForm").addEventListener("submit", function (e) {
        e.preventDefault();

        let num1 = Number(document.getElementById("num1").value);
        let num2 = Number(document.getElementById("num2").value);
        let num3 = Number(document.getElementById("num3").value);

        let maior = Math.max(num1, num2, num3);


        document.getElementById("meuForm").remove();

        document.getElementById("main").innerHTML = `
            <div class="min-w-80 bg-gray-300 shadow-md rounded px-8 pt-6 pb-8 mb-4 flex flex-col">
                <h1 class="font-bold">
                    Resultado:
                </h1>   
                <p>O maior número é o ${maior}</p>
            </div>
        `;
    });
</script>

<script src="https://cdn.tailwindcss.com"></script>
