<div id="main" class="h-screen flex items-center justify-center">
    <form 
        class="bg-gray-300 shadow-md rounded px-8 pt-6 pb-8 mb-4"
        id="meuForm"
        action=""
        method="get"
    >
        <div class="mb-4">
            <label
                class="block text-gray-700 text-sm font-bold mb-2"
                for="num1"
            >
                Digite o primeiro número:
            </label>

            <input
                class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                type="number"
                name="num1"
                id="num1"
                step="any"
            >
        </div>

        <div class="mb-4">
            <label
                class="block text-gray-700 text-sm font-bold mb-2"
                for="num2"
            >
                Digite o segundo número:
            </label>

            <input
                class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                type="number"
                name="num2"
                id="num2"
                step="any"
            >
        </div>

        <div class="flex items-center justify-center">
            <input
                class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline"
                type="submit"
                value="Enviar"
            >
        </div>
    </form>
</div>

<script>
    document.getElementById("meuForm").addEventListener("submit", function (e) {
        e.preventDefault();

        let num1Input = document.getElementById("num1");
        let num2Input = document.getElementById("num2");

        let num1 = parseFloat(num1Input.value);
        let num2 = parseFloat(num2Input.value);

        if (isNaN(num1) || isNaN(num2)) {
            alert("Digite os dois números!");
            return;
        }

        let soma = num1 + num2;
        let sub = num1 - num2;
        let mult = num1 * num2;

        let div;

        if (num2 === 0) {
            div = "Não é possível dividir por zero";
        } else {
            div = num1 / num2;
        }

        document.getElementById("meuForm").remove();

        document.getElementById("main").innerHTML = `
            <div class="min-w-80 bg-gray-300 shadow-md rounded px-8 pt-6 pb-8 mb-4 flex flex-col">
                <h1 class="font-bold">
                    Resultado:
                </h1>

                <p>Soma: ${soma}</p>
                <p>Subtração: ${sub}</p>
                <p>Divisão: ${div}</p>
                <p>Multiplicação: ${mult}</p>
            </div>
        `;
    });
</script>

<script src="https://cdn.tailwindcss.com"></script>
